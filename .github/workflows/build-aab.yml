name: Build AAB for Google Play

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Build AAB
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64
        run: |
          printf "n\n/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64\n" | bubblewrap build --input twa-manifest.json 2>&1 || true

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
