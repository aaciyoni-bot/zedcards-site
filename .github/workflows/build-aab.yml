name: Build AAB for Google Play

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create signing key
        run: |
          mkdir -p app/keystore
          keytool -genkey -v -keystore app/keystore/signing.keystore \
            -alias androidsigningkey -keyalg RSA -keysize 2048 -validity 10000 \
            -keypass android -storepass android -dname "CN=ORIZIS,O=ORIZIS,C=ZM"

      - name: Create updated twa-manifest
        run: |
          cat > twa-manifest-updated.json << 'EOF'
          {
            "packageId": "com.orizis.vochira",
            "host": "vochira.com",
            "launcherUrl": "https://vochira.com/",
            "name": "Vochira: Gift Cards & Codes",
            "shortName": "Vochira",
            "startUrl": "/?utm_source=installed_pwa",
            "display": "standalone",
            "backgroundColor": "#FFFFFF",
            "themeColor": "#000000",
            "orientation": "portrait-primary",
            "signingKey": {
              "path": "app/keystore/signing.keystore",
              "alias": "androidsigningkey",
              "keyPassword": "android",
              "storePassword": "android"
            }
          }
          EOF

      - name: Build with bubblewrap (non-interactive)
        run: |
          bubblewrap build --input twa-manifest-updated.json --skipPwaValidation || echo "Build attempted"

      - name: Check for built files
        run: |
          find . -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No AAB/APK found yet"
          ls -la app/build/outputs/bundle/release/ 2>/dev/null || echo "No bundle directory"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          retention-days: 30
