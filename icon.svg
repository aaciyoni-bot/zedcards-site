  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- The voucher stub: rounded card with a torn notch on each side. -->
  <path d="M134 141h244a48 48 0 0 1 48 48v35a32 32 0 0 0 0 64v35a48 48 0 0 1-48 48H134a48 48 0 0 1-48-48v-35a32 32 0 0 0 0-64v-35a48 48 0 0 1 48-48z"
